<script>
(() => {
  // Set server-side by the Groomer House checkout plugin; missing config fails closed.
  const checkout = window.groomerhouseCheckout || {configured:false,mode:'unavailable'};
  const PAYMENTS_CONNECTED = checkout.configured === true;
  const setupCheckout = () => {
    const panel = document.querySelector('.booknetic_appointment');
    if (!panel) return;
    const update = () => {
      // These newer labels are not exposed in Booknetic's native Translator.
      [['.booknetic_view_more_service_notes_button', 'Pokaż więcej'], ['.booknetic_view_less_service_notes_button', 'Pokaż mniej'], ['.booknetic_try_again_btn', 'Spróbuj ponownie']].forEach(([selector, text]) => {
        panel.querySelectorAll(selector).forEach(label => { if (label.textContent !== text) label.textContent = text; });
      });
      const finalStep = panel.querySelector('.booknetic_active_step[data-step-id="confirm_details"]');
      const buttons = panel.querySelectorAll('.booknetic_appointment_container_footer .booknetic_next_step_btn, .booknetic_appointment_container_footer .booknetic_confirm_booking_btn');
      if (Boolean(finalStep) !== panel.classList.contains('gh-checkout-final')) panel.classList.toggle('gh-checkout-final', Boolean(finalStep));
      buttons.forEach(button => {
        if (finalStep && !PAYMENTS_CONNECTED) {
          if (!button.dataset.ghPaymentBlocked) button.dataset.ghOriginalLabel = button.textContent;
          if (!button.disabled) button.disabled = true;
          button.dataset.ghPaymentBlocked = 'true';
          if (button.textContent !== 'Zapłać przez Przelewy24') button.textContent = 'Zapłać przez Przelewy24';
          button.title = 'Płatność online jest obecnie niedostępna';
        } else if (button.dataset.ghPaymentBlocked) {
          delete button.dataset.ghPaymentBlocked;
          button.disabled = false;
          button.textContent = button.dataset.ghOriginalLabel || 'DALEJ';
          delete button.dataset.ghOriginalLabel;
          button.removeAttribute('title');
        }
      });
      if (finalStep) {
        const labels = [['label[for="input_deposit_2"]', 'Zaliczka'], ['label[for="input_deposit_1"]', 'Pełna kwota'], ['.booknetic_deposit_price > div:first-child', 'Zaliczka:']];
        labels.forEach(([selector, text]) => { const label = panel.querySelector(selector); if (label && label.textContent !== text) label.textContent = text; });
      }
    };
    panel.addEventListener('click', event => {
      if (!PAYMENTS_CONNECTED && panel.classList.contains('gh-checkout-final') && event.target.closest('.booknetic_appointment_container_footer .booknetic_btn_primary')) {
        event.preventDefault(); event.stopImmediatePropagation();
      }
    }, true);
    new MutationObserver(update).observe(panel, {childList:true, subtree:true, attributes:true, attributeFilter:['class','disabled']});
    if (window.bookneticHooks) window.bookneticHooks.addFilter('step_validation_confirm_details', result => PAYMENTS_CONNECTED ? result : {status:false,errorMsg:'Płatność online jest obecnie niedostępna.'}, 'groomerhouse-payment-state');
    update();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', setupCheckout, {once:true});
  else setupCheckout();
  if (window.parent === window) return;
  const targets = ['https://groomerhouse.pl', 'https://www.groomerhouse.pl', 'http://127.0.0.1:4387'];
  let scheduled = false;
  let lastHeight = 0;
  const sendSize = () => {
    scheduled = false;
    const main = document.querySelector('main');
    const height = Math.ceil((main?.getBoundingClientRect().height || document.body.getBoundingClientRect().height) + 24);
    if (height === lastHeight) return;
    lastHeight = height;
    targets.forEach(origin => window.parent.postMessage({type:'groomerhouse:booking-height',height}, origin));
  };
  const queueSize = () => {
    if (!scheduled) { scheduled = true; requestAnimationFrame(sendSize); }
  };
  const start = () => {
    new ResizeObserver(queueSize).observe(document.querySelector('main') || document.body);
    window.addEventListener('resize', queueSize);
    queueSize();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, {once:true});
  else start();
})();
</script>
